# Errors found in published source files. docs/data_issues.qmd builds its page from this file.

[[issue]]
id = "ccs-2015q4-corporate-year"
publisher = "Bank of England"
dataset = "Credit Conditions Survey"
title = "A year is mistyped in the corporate sheet of the 2015 Q4 annex"
published = "2016-01-15"
logged = "2026-11-02"
location = "Corporate annex sheet, cell in column AD of the row of years"
problem = "The row of years reads 2013 twice, so the four columns for 2014 are headed 2013."
correction = "Column AD should read 2014."
effect = "Reading the years as written puts the 2014 results against 2013, and leaves 2014 with no results."
handling = "The archive works out each column's year from the order of the quarter labels, so these values are stored against 2014."
file_name = "2015-annex-q4.xlsx"
source_page = "https://www.bankofengland.co.uk/credit-conditions-survey/2015/2015-q4"

[[issue]]
id = "ccs-2019q2-misplaced-year"
publisher = "Bank of England"
dataset = "Credit Conditions Survey"
title = "The year 2016 is two columns late in the 2019 Q2 annex"
published = "2019-07-18"
logged = "2026-11-02"
location = "Secured annex, Unsecured annex and Corporate annex sheets, row of years, columns AL and AN"
problem = "The label 2016 sits above the third quarter of 2016 instead of the first, so the first two quarters of 2016 appear under 2015."
correction = "The label 2016 should be in column AL, above the first quarter of 2016."
effect = "Reading the years as written replaces the 2015 Q1 and Q2 results with those for 2016 Q1 and Q2, in all three sheets."
handling = "The archive works out each column's year from the order of the quarter labels, so these values are stored against 2016."
file_name = "2019-q2-annex.xlsx"
source_page = "https://www.bankofengland.co.uk/credit-conditions-survey/2019/2019-q2"

[[issue]]
id = "ccs-2024q1-corporate-year"
publisher = "Bank of England"
dataset = "Credit Conditions Survey"
title = "The year 2024 is missing from the corporate sheet of the 2024 Q1 annex"
published = "2024-04-11"
logged = "2026-11-02"
location = "Corporate annex sheet, row of years, column BR"
problem = "The newest column has the quarter label Q1 but no year above it, so it appears to belong to 2023."
correction = "Column BR should be headed 2024."
effect = "Reading the years as written replaces the 2023 Q1 results with those for 2024 Q1, and delays the first appearance of 2024 Q1 by a quarter."
handling = "The archive works out each column's year from the order of the quarter labels, so these values are stored against 2024 Q1."
file_name = "ccs-2024-q1-annex.xlsx"
source_page = "https://www.bankofengland.co.uk/credit-conditions-survey/2024/2024-q1"

[[issue]]
id = "ons-ybus-annual-scale"
publisher = "Office for National Statistics"
dataset = "Labour market statistics"
title = "Annual total weekly hours worked are about 1,000 times too large"
published = "2019-02-19"
logged = "2026-11-02"
location = "Series YBUS, annual values, version 40 of the time-series page"
problem = "Annual values are about 1,000 times too large, for example 1,037,545 for 2018. The series is measured in millions of hours per week."
correction = "Version 41 of the page, which the archive dates 20 February 2019, gives 1,037.6 for 2018."
effect = "The annual values appear to be revised by about 1,000 times, twice, within two days."
handling = "Kept as published. Leave out annual YBUS rows dated 19 February 2019 when studying revisions."
source_page = "https://www.ons.gov.uk/employmentandlabourmarket/peopleinwork/employmentandemployeetypes/timeseries/ybus/lms/previous/v40"

[[issue]]
id = "ons-npqt-2002q2-growth"
publisher = "Office for National Statistics"
dataset = "Revisions triangle for gross fixed capital formation"
title = "Growth in gross fixed capital formation for 2002 Q2 looks mistyped"
published = "2002-08-31"
logged = "2026-11-02"
location = "Series NPQT_QOQ in the archive, August 2002 vintage, value for 2002 Q2"
problem = "The triangle gives growth of -5.5% for 2002 Q2. The next vintage gives -0.1%. This is our assessment, not a statement from ONS."
effect = "The figure looks like a large revision, and it is one of the largest gaps between published growth and growth worked out from levels."
handling = "Kept as published."
file_name = "expenditure.zip"
source_page = "https://www.ons.gov.uk/economy/grossdomesticproductgdp/datasets/revisionstrianglesforcomponentsfortheexpenditureapproachtothemeasureofukgdp"

[[issue]]
id = "ons-bics-mistyped-wave-dates"
publisher = "Office for National Statistics"
dataset = "Business Insights and Conditions Survey"
title = "Some older files hold mistyped survey dates"
logged = "2026-11-02"
location = "Dates worksheets in older files, waves 20, 55 and 135"
problem = "The dates given for these waves are mistyped, for example the wrong year for wave 55."
effect = "Using the dates as written would place these waves' results on the wrong days."
handling = "Every wave uses the date given in the newest file."

[[issue]]
id = "ons-bics-stale-release-dates"
publisher = "Office for National Statistics"
dataset = "Business Insights and Conditions Survey"
title = "Some editions carry the previous wave's release date"
logged = "2026-11-02"
location = "Release date of 20 of the 160 editions read"
problem = "The release date shown falls before that edition's own survey had closed, so it cannot be right."
effect = "Using the date as written would show results as public before they could have existed."
handling = "These editions use the next ONS release date instead, with precision upper_bound, so they can be about two weeks late."
