[project]
name = "real-time-data"
version = "0.1.1"
description = "A real-time (vintage) archive of UK economic data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.3.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.1",
    "xlrd>=2.0.2",
    "pyarrow>=21.0.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.5",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
]
docs = [
    "ibis-framework[duckdb]>=12.0.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
realtime = "realtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["realtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I"]
