# Which series the archive collects, and from where.
#
# [[series]] entries are collected from every past version of every ONS
# time-series page for that CDID (late 2015 onwards, exact release dates).
# [[triangle]] entries are collected from ONS revisions-triangle spreadsheets
# (often back to the 1990s, publication month only).

# ---------------------------------------------------------------- Output

[[series]]
id = "ABMI"
short_name = "gdp"
measure = "£m; CVM; SA"
primary_dataset = "QNA"

[[series]]
