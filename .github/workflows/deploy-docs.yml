name: Deploy docs

on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  version-check:
    name: Check for a new version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.compare.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: compare
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          read_version() {
            python3 -c "import sys, tomllib; print(tomllib.loads(sys.stdin.read())['project']['version'])"
          }
          current=$(read_version < pyproject.toml)
          previous=$(git show "$BEFORE:pyproject.toml" 2>/dev/null | read_version || true)
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$current" != "$previous" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build docs
    needs: version-check
    if: needs.version-check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: uv sync --locked --group docs
      - run: uv run --group docs quarto render docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
